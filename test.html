<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마시가네 맛집 지도</title>
<meta name="robots" content="noindex">
<meta name="description" content="마시가네(@masigane_masiga)가 다녀온 야장·방어 맛집 지도">
<meta property="og:title" content="마시가네 맛집 지도">
<meta property="og:description" content="마시가네가 다녀온 야장, 방어 맛집을 지도로 모았어요">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pin:#0E1512;--ink:#0E1512;--sub:#4E5968;--mute:#8B95A1;--line:#ECEEF0;--soft:#F2F4F6;--green:#0B7A50;--green-d:#08643F;--green-l:#E3F3EB;--pink:#D6245F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--ink);background:#EEF1EF}
button,input{font-family:inherit}
#map{position:fixed;inset:0;width:100%;height:100vh;height:100dvh}
.mapmsg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:15px;line-height:1.6;padding:24px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* top */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;flex-direction:column;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.head{background:#fff;padding:calc(env(safe-area-inset-top) + 20px) 20px 0;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.handle{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--mute);letter-spacing:0}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-1.4px;line-height:1.12}
.follow{flex:none;height:44px;padding:0 16px 0 13px;border-radius:22px;background:var(--ink);color:#fff;text-decoration:none;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;margin-top:2px}
.maps{display:flex;gap:24px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.maps::-webkit-scrollbar{display:none}
.mp{flex:none;border:0;background:none;padding:2px 0 12px;font:700 19px "IBM Plex Sans KR",sans-serif;letter-spacing:-.4px;color:#B4BBC2;cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:baseline;gap:6px}
.mp small{font-size:14px;font-weight:600}
.mp.on{color:var(--ink);border-bottom-color:var(--ink)}
.mp.more{color:var(--sub);font-weight:600}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 15px;border-radius:19px;border:0;background:#fff;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px rgba(14,21,18,.16)}
.chip.on{background:var(--ink);color:#fff;font-weight:700}

/* markers */
.mk{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mk .dot{width:18px;height:18px;border-radius:50%;background:var(--pin);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mk .lb{position:absolute;bottom:22px;white-space:nowrap;background:var(--ink);color:#fff;font:700 12px "IBM Plex Sans KR",sans-serif;padding:4px 8px;border-radius:7px;display:none}
.show-labels .mk .lb{display:block;background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.mk.sel .dot{width:26px;height:26px;border-width:4px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mk.sel .lb{display:block;bottom:30px;background:var(--ink);color:#fff;font-size:13px;padding:5px 10px}
.mk.temp .dot{background:var(--pink)}

/* list button (FAB) */
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 24px);z-index:35;width:84px;height:84px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 15px "IBM Plex Sans KR",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;transition:bottom .2s ease}
.fab small{font-size:12px;font-weight:600;opacity:.75}

/* place card */
.card{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:30;background:#fff;border-radius:22px;padding:18px 18px 16px;box-shadow:0 8px 28px rgba(14,21,18,.18);display:none}
.card.show{display:block}
.detail{display:flex;flex-direction:column;gap:12px}
.tag{font-size:13px;font-weight:700;color:var(--sub)}
.d-head{display:flex;flex-direction:column;gap:4px}
.d-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.25}
.addr{margin:0;font-size:15px;color:var(--sub)}
.memo{margin:0;font-size:15px;line-height:1.6;white-space:pre-wrap}
.close{flex:none;width:44px;height:44px;margin:-10px -10px 0 0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.acts{display:flex;gap:8px}
.btn{height:52px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{flex:1;background:var(--ink);color:#fff}
.btn.line{flex:none;padding:0 18px;background:var(--soft);color:var(--ink)}
.btn.reel{flex:none;padding:0 16px;background:#FBE4EC;color:#9C1440}

/* list panel */
.sheet{position:fixed;left:0;right:0;bottom:0;height:56vh;height:56dvh;z-index:40;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(14,21,18,.16);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-top{padding:18px 20px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.7px}
.toMap{height:44px;padding:0 16px;border-radius:22px;border:0;background:var(--soft);color:var(--ink);font:700 15px "IBM Plex Sans KR",sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px}
.search{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-radius:14px;background:var(--soft)}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:16px;font-weight:500;color:var(--ink)}
.sheet-body{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 24px);-webkit-overflow-scrolling:touch}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;min-height:72px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:0}
.row.on{background:var(--soft);margin:0 -20px;padding:10px 20px;width:calc(100% + 40px)}
#sdetail:not(:empty){padding:16px 0 18px;margin:0 -20px;padding-left:20px;padding-right:20px;border-bottom:8px solid var(--soft)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row .n{font-size:17px;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m b{color:var(--sub);font-weight:600;margin-right:6px}
.empty{padding:32px 0;text-align:center;color:var(--sub);font-size:15px;line-height:1.6}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:16px 0 4px}

/* admin (?admin) */
.admin{display:none;border-top:8px solid var(--soft);margin:12px -20px 0;padding:16px 20px 0}
.is-admin .admin{display:block}
.admin h4{margin:0 0 6px;font-size:16px}
.admin p{margin:0 0 8px;font-size:13px;color:var(--sub);line-height:1.5}
.admin label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
.admin input,.admin select,.admin textarea{width:100%;border:1px solid #C8D0CB;border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink);background:#fff}
.admin pre{background:var(--soft);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;min-height:40px}
.admin .btn{margin-top:10px;width:100%;border:0;cursor:pointer}

.dim{position:fixed;inset:0;z-index:60;background:rgba(14,21,18,.45);display:none}
.dim.open{display:block}
.picker{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 24px);display:none;flex-direction:column;gap:14px}
.picker.open{display:flex}
.picker h2{font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{min-height:72px;border-radius:16px;border:0;background:var(--soft);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:10px 16px;font-family:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.mcard.on{background:var(--ink);color:#fff}
.mcard .n{font-size:18px;font-weight:700}
.mcard .s{font-size:13px;font-weight:600;opacity:.7}

.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(14,21,18,.9);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70;white-space:nowrap}
.toast.show{opacity:1}

@media (min-width:768px){
  .top{right:auto;width:440px;left:16px;top:16px}
  .head{border-radius:24px;padding:22px 22px 0;box-shadow:0 4px 20px rgba(14,21,18,.10)}
  .chips{padding:0}
  .sheet{left:16px;right:auto;top:auto;bottom:16px;width:440px;height:calc(100vh - var(--top-h, 240px) - 28px);border-radius:24px;transform:none;visibility:visible;box-shadow:0 4px 20px rgba(14,21,18,.10)}
  .sheet-top{padding-top:18px}
  .toMap,.fab{display:none}
  .card{left:auto;right:24px;width:380px;bottom:24px}
  .picker{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:440px;border-radius:24px}
}
@media (prefers-reduced-motion:reduce){.sheet,.fab{transition:none}}
</style>
</head>
<body>
<div id="map"></div>
<div class="mapmsg" id="mapmsg">지도를 불러오는 중이에요</div>

<div class="top" id="top">
  <header class="head">
    <div class="head-row">
      <div><p class="handle">@masigane_masiga</p><h1>마시가네<br>맛집 지도</h1></div>
      <a class="follow" data-ev="insta_click" href="https://www.instagram.com/masigane_masiga/" target="_blank" rel="noopener" aria-label="마시가네 인스타그램 팔로우"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.8" cy="7.2" r=".6" fill="#fff"/></svg>팔로우</a>
    </div>
    <nav class="maps" id="maps" aria-label="지도 종류"></nav>
  </header>
  <div class="chips" id="chips"></div>
</div>

<button class="fab" id="fab" aria-controls="sheet" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>목록</span><small id="fabN"></small></button>
<section class="card" id="card" aria-live="polite"><div id="detail"></div></section>

<section class="sheet" id="sheet" aria-label="가게 목록">
  <div class="sheet-top">
    <div class="sheet-h"><h3 id="listTitle">목록</h3><button class="toMap" id="toMap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>목록 닫기</button></div>
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4E5968" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="가게, 동네 검색" aria-label="가게 검색">
    </label>
  </div>
  <div class="sheet-body" id="body">
    <div id="sdetail"></div>
    <div class="list" id="list"></div>
    <div class="foot">지도 데이터 © NAVER Corp.</div>

    <section class="admin" id="admin">
      <h4>가게 추가 도우미</h4>
      <p>지도를 탭하면 위치가 찍혀요. 내용을 채우고 JSON을 복사해 지금 보는 지도의 데이터 파일 배열 끝에 붙여 넣으면 반영돼요.</p>
      <label for="a_name">가게 이름</label><input id="a_name">
      <label for="a_area">구 (필터 이름)</label><input id="a_area" placeholder="예) 중구">
      <label for="a_type">종류</label><select id="a_type"></select>
      <label for="a_menu">대표 메뉴</label><input id="a_menu">
      <label for="a_memo">한 줄 메모</label><textarea id="a_memo"></textarea>
      <label for="a_naver">네이버지도 링크</label><input id="a_naver" placeholder="https://map.naver.com/p/entry/place/...">
      <label for="a_reel">릴스 링크</label><input id="a_reel">
      <label>위치</label><p id="a_loc">지도를 탭하세요</p>
      <pre id="a_out"></pre>
      <button class="btn primary" id="a_copy">JSON 복사</button>
    </section>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>
<div class="dim" id="dim"></div>
<section class="picker" id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerT">
  <h2 id="pickerT">어떤 지도 볼까요?</h2>
  <div class="grid" id="grid"></div>
</section>

<script>
/* ===== 설정 ===== */
const NCP_KEY_ID = "t2hlw513tp";
// 지도 종류: 새 지도는 여기에 한 줄 추가 + 데이터 파일(json) 추가
const MAPS = [
  { id: "yajang", name: "야장", file: "places.json", color: "#0B7A50" },
  { id: "bangeo", name: "방어", file: "bangeo.json", color: "#1F5FBF" }
];
// 방문·클릭 통계 (Supabase). 비어 있으면 기록하지 않아요.
const SUPA_URL = "https://qcrnllwyquqsvebxxwyl.supabase.co";
const SUPA_KEY = "sb_publishable_gfYEhAJYkvEvbgfG1FNV1g_4M2QXUAB";
/* ================ */

const TYPES = ["노가리·호프", "포차", "고기", "해산물", "전·막걸리", "치킨", "횟집", "이자카야·바", "수산시장", "방어", "기타"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => { try { const x = new URL(String(u || "").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const placeNo = p => { const m = String(p.naver || "").match(/place\/(\d+)/); return m ? m[1] : ""; };
const q2 = p => encodeURIComponent(`${p.name} ${p.area || ""}`.trim());
const mapUrl = p => placeNo(p) ? `https://map.naver.com/p/entry/place/${placeNo(p)}` : "https://map.naver.com/p/search/" + q2(p);
const infoUrl = p => placeNo(p) ? `https://m.place.naver.com/place/${placeNo(p)}/home` : (safeUrl(p.naver) || "https://m.search.naver.com/search.naver?query=" + q2(p));
const isAdmin = new URLSearchParams(location.search).has("admin");
if (isAdmin) document.body.classList.add("is-admin");

let cur = MAPS.find(m => "#" + m.id === location.hash) || MAPS[0];
const cache = {};
let places = [], filter = "전체", query = "", selId = null;
let map = null, markers = new Map(), tempMarker = null;
const topH = () => $("top").getBoundingClientRect().bottom + 10;

/* ----- 통계 ----- */
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = (k, s) => { try { let v = s.getItem(k); if (!v) { v = rid(); s.setItem(k, v); } return v; } catch { return rid(); } };
const VISITOR = store("mg_vid", window.localStorage), SESSION = store("mg_sid", window.sessionStorage);
function track(type, p) {
  if (!SUPA_URL || !SUPA_KEY || isAdmin) return;
  const body = { type, map: cur.id, place_id: p ? p.id : null, place_name: p ? p.name : null, visitor: VISITOR, session: SESSION, ref: document.referrer ? new URL(document.referrer).hostname : null };
  try {
    fetch(`${SUPA_URL}/rest/v1/events`, { method: "POST", keepalive: true,
      headers: { apikey: SUPA_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify(body) }).catch(() => {});
  } catch {}
}
document.addEventListener("click", e => {
  const a = e.target.closest("[data-ev]"); if (!a) return;
  track(a.dataset.ev, places.find(x => x.id === a.dataset.pid));
});

function visible() {
  const q = query.trim().toLowerCase();
  return places.filter(p => (filter === "전체" || p.area === filter) &&
    (!q || [p.name, p.area, p.menu, p.memo, p.address].some(v => (v || "").toLowerCase().includes(q))));
}

const PILL_MAX = 5; // 이보다 많으면 끝에 "전체" 버튼
function renderTabs() {
  const cnt = m => cache[m.id] ? cache[m.id].length : null;
  const sub = m => { const n = cnt(m); return n ? `${n}` : n === 0 ? "준비 중" : ""; };
  const nav = $("maps"); nav.innerHTML = "";
  MAPS.forEach(m => {
    const b = document.createElement("button");
    b.className = "mp" + (m === cur ? " on" : ""); b.setAttribute("aria-pressed", m === cur);
    b.innerHTML = `${esc(m.name)}<small>${sub(m)}</small>`;
    b.onclick = () => { if (m !== cur) location.hash = m.id; };
    nav.appendChild(b);
  });
  if (MAPS.length > PILL_MAX) {
    const b = document.createElement("button"); b.className = "mp more"; b.textContent = `전체 ${MAPS.length}개`;
    b.onclick = openPicker; nav.appendChild(b);
  }
  const on = nav.querySelector(".on"); if (on) on.scrollIntoView({ block: "nearest", inline: "nearest" });
  const g = $("grid"); g.innerHTML = "";
  MAPS.forEach(m => {
    const b = document.createElement("button");
    b.className = "mcard" + (m === cur ? " on" : "");
    b.innerHTML = `<span class="n">${esc(m.name)}</span><span class="s">${cnt(m) ? cnt(m) + "곳" : sub(m)}</span>`;
    b.onclick = () => { closePicker(); if (m !== cur) location.hash = m.id; };
    g.appendChild(b);
  });
}
function openPicker() { $("dim").classList.add("open"); $("picker").classList.add("open"); const on = $("grid").querySelector(".on"); (on || $("grid").firstChild)?.focus(); }
function closePicker() { if (!$("picker").classList.contains("open")) return; $("dim").classList.remove("open"); $("picker").classList.remove("open"); }
$("dim").onclick = closePicker;
renderTabs();
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePicker(); closeList(); } });
function render() {
  renderTabs();
  const cnt = {}; places.forEach(p => { if (p.area) cnt[p.area] = (cnt[p.area] || 0) + 1; });
  const areas = Object.keys(cnt).sort((a, b) => (a === "서울 밖") - (b === "서울 밖") || cnt[b] - cnt[a]);
  const chips = $("chips"); chips.innerHTML = "";
  if (places.length) ["전체", ...areas].forEach(a => {
    const b = document.createElement("button");
    b.className = "chip" + (a === filter ? " on" : "");
    b.textContent = a === "전체" ? `전체 ${places.length}` : `${a} ${cnt[a]}`;
    b.setAttribute("aria-pressed", a === filter);
    b.onclick = () => { filter = a; selId = null; render(); fit(); };
    chips.appendChild(b);
  });

  const sel = places.find(x => x.id === selId);
  const inList = listMode();
  const det = inList ? $("sdetail") : $("detail");
  (inList ? $("detail") : $("sdetail")).innerHTML = "";
  if (sel) {
    const reel = safeUrl(sel.reel);
    det.innerHTML = `<div class="detail">
      <div class="d-head">
        <div class="d-row"><span class="tag">${esc(sel.type)}</span>
          <button class="close" id="closeSel" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1512" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <h2>${esc(sel.name)}</h2>
        ${sel.address ? `<p class="addr">${esc(sel.address)}</p>` : ""}
      </div>
      ${sel.menu ? `<p class="memo"><b>대표 메뉴</b> ${esc(sel.menu)}</p>` : ""}
      ${sel.memo ? `<p class="memo">${esc(sel.memo)}</p>` : ""}
      <div class="acts">
        <a class="btn primary" data-ev="info_click" data-pid="${esc(sel.id)}" href="${esc(infoUrl(sel))}" target="_blank" rel="noopener">가게 정보·리뷰</a>
        ${reel ? `<a class="btn reel" data-ev="reel_click" data-pid="${esc(sel.id)}" href="${esc(reel)}" target="_blank" rel="noopener">릴스</a>` : ""}
        <a class="btn line" data-ev="mapapp_click" data-pid="${esc(sel.id)}" href="${esc(mapUrl(sel))}" target="_blank" rel="noopener">지도 앱</a>
      </div>
    </div>`;
    $("closeSel").onclick = () => { selId = null; render(); };
  } else det.innerHTML = "";
  $("card").classList.toggle("show", !!sel && !inList);
  placeFab();

  const listSrc = visible();
  const label = filter === "전체" ? cur.name : `${filter} ${cur.name}`;
  $("listTitle").textContent = `${label} ${listSrc.length}곳`;
  $("fabN").textContent = places.length ? listSrc.length : "";
  const list = $("list"); list.innerHTML = "";
  if (!places.length) list.innerHTML = `<div class="empty">${esc(cur.name)} 지도는 곧 업데이트돼요. 인스타 팔로우하고 기다려 주세요!</div>`;
  else if (!listSrc.length) list.innerHTML = `<div class="empty">조건에 맞는 가게가 없어요. 검색어나 동네를 바꿔 보세요.</div>`;
  listSrc.forEach(p => {
    const r = document.createElement("button"); r.className = "row";
    const addr = (p.address || "").split(" ").slice(2).join(" ") || p.address || "";
    r.innerHTML = `<span class="t"><span class="n">${esc(p.name)}</span><span class="m"><b>${esc(p.type)}</b>${esc(p.area && p.area !== "서울 밖" ? p.area + " " : "")}${esc(addr)}</span></span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A948F" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`;
    if (p.id === selId) r.classList.add("on");
    r.onclick = () => select(p.id, true);
    list.appendChild(r);
  });
  syncMarkers();
}

function select(id, pan) {
  selId = id; if (listMode()) closeList(); else render();
  const p = places.find(x => x.id === id);
  track("place_open", p);
  if (!p || !pan || !map) return;
  map.setZoom(Math.max(map.getZoom(), 16)); map.setCenter(new naver.maps.LatLng(p.lat, p.lng));
  if (wideScr()) map.panBy(new naver.maps.Point(-230, 0));
  else {
    const bottom = listMode() ? $("sheet").getBoundingClientRect().top : window.innerHeight - $("card").offsetHeight - 24;
    map.panBy(new naver.maps.Point(0, window.innerHeight / 2 - (topH() + bottom) / 2));
  }
}
/* 목록 화면 열기·닫기 + 목록 버튼 위치 */
const wideScr = () => window.innerWidth >= 768;
const listMode = () => !wideScr() && $("sheet").classList.contains("open");
function openList() { $("sheet").classList.add("open"); $("fab").setAttribute("aria-expanded", "true"); $("fab").style.visibility = "hidden"; $("body").scrollTop = 0; render(); }
function closeList() { $("sheet").classList.remove("open"); $("fab").setAttribute("aria-expanded", "false"); $("fab").style.visibility = ""; render(); }
function placeFab() {
  const c = $("card");
  $("fab").style.bottom = c.classList.contains("show") && !wideScr() ? `calc(env(safe-area-inset-bottom) + ${c.offsetHeight + 28}px)` : "";
  document.documentElement.style.setProperty("--top-h", $("top").getBoundingClientRect().bottom + "px");
}
$("fab").onclick = openList; $("toMap").onclick = closeList;
window.addEventListener("resize", placeFab);

/* ----- map ----- */
const mkHtml = (p, sel) => `<div class="mk${sel ? " sel" : ""}"><span class="lb">${esc(p.name)}</span><span class="dot"></span></div>`;
const ANCHOR = sel => new naver.maps.Point(sel ? 13 : 9, sel ? 13 : 9);
function clearMarkers() { markers.forEach(m => m.setMap(null)); markers.clear(); }
function syncMarkers() {
  if (!map) return;
  const vis = new Set(visible().map(p => p.id));
  places.forEach(p => {
    let m = markers.get(p.id);
    if (!m) {
      m = new naver.maps.Marker({ position: new naver.maps.LatLng(p.lat, p.lng), map: null, icon: { content: mkHtml(p, false), anchor: ANCHOR(false) } });
      naver.maps.Event.addListener(m, "click", () => select(p.id, true));
      m._sel = false; markers.set(p.id, m);
    }
    const sel = p.id === selId;
    if (m._sel !== sel) { m.setIcon({ content: mkHtml(p, sel), anchor: ANCHOR(sel) }); m.setZIndex(sel ? 1000 : 0); m._sel = sel; }
    const want = vis.has(p.id) || sel ? map : null;
    if (m.getMap() !== want) m.setMap(want);
  });
}
function fit(list) {
  if (!map) return;
  const vis = list || visible();
  if (!vis.length) return;
  if (vis.length === 1) { map.morph(new naver.maps.LatLng(vis[0].lat, vis[0].lng), 16); return; }
  const lats = vis.map(p => p.lat), lngs = vis.map(p => p.lng);
  const wide = window.innerWidth >= 768;
  map.fitBounds(new naver.maps.LatLngBounds(new naver.maps.LatLng(Math.min(...lats), Math.min(...lngs)), new naver.maps.LatLng(Math.max(...lats), Math.max(...lngs))),
    wide ? { top: 40, right: 40, bottom: 40, left: 480 } : { top: topH(), right: 40, bottom: 130, left: 40 });
}
function initialView() {
  if (!map) return;
  if (filter !== "전체" || query) return fit();
  const wide = wideScr();
  map.setCenter(new naver.maps.LatLng(37.548, 126.99)); map.setZoom(wide ? 13 : 12);
  map.panBy(new naver.maps.Point(wide ? -230 : 0, wide ? 0 : -((topH() + window.innerHeight) / 2 - window.innerHeight / 2)));
}

window.initMap = function () {
  (function wait(n) { if (window.naver && naver.maps && naver.maps.Map) startMap(); else if (n < 200) setTimeout(() => wait(n + 1), 50); })(0);
};
function startMap() {
  $("mapmsg").remove();
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(37.548, 126.99), zoom: 12,
    zoomControl: false, scaleControl: false, mapDataControl: false,
    logoControlOptions: { position: naver.maps.Position.BOTTOM_RIGHT }
  });
  const toggleLabels = () => $("map").classList.toggle("show-labels", map.getZoom() >= 16);
  naver.maps.Event.addListener(map, "zoom_changed", toggleLabels); toggleLabels();
  naver.maps.Event.addListener(map, "click", e => {
    if (isAdmin) { setTemp(e.coord.lat(), e.coord.lng()); return; }
    if (selId) { selId = null; render(); }
  });
  render(); initialView();
}
window.navermap_authFailure = function () {
  $("map").innerHTML = `<div class="mapmsg">지도 인증에 실패했어요. 네이버 클라우드 콘솔에서 이 사이트 주소가 서비스 URL로 등록돼 있는지 확인해 주세요.</div>`;
};
(function loadMap() {
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NCP_KEY_ID)}&callback=initMap`;
  s.onerror = () => { $("mapmsg").textContent = "지도를 불러오지 못했어요. 새로고침해 주세요."; };
  document.head.appendChild(s);
})();

$("q").addEventListener("input", e => { query = e.target.value; render(); });

/* ----- admin helper ----- */
let tmp = null;
function setTemp(lat, lng) {
  tmp = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
  $("a_loc").textContent = `${tmp.lat}, ${tmp.lng}`;
  const html = `<div class="mk temp"><span class="dot"></span></div>`;
  if (!tempMarker) tempMarker = new naver.maps.Marker({ position: new naver.maps.LatLng(tmp.lat, tmp.lng), map, icon: { content: html, anchor: ANCHOR(false) } });
  else tempMarker.setPosition(new naver.maps.LatLng(tmp.lat, tmp.lng));
  out();
}
function out() {
  const v = k => $("a_" + k).value.trim();
  const o = { id: "m" + Date.now().toString(36), name: v("name"), area: v("area"), type: $("a_type").value, address: "", memo: v("memo"), menu: v("menu"), naver: v("naver"), reel: v("reel"), lat: tmp && tmp.lat, lng: tmp && tmp.lng };
  $("a_out").textContent = o.name && tmp ? JSON.stringify(o) + "," : "가게 이름과 위치를 넣어 주세요";
}
TYPES.forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = t; $("a_type").appendChild(o); });
["name", "area", "type", "menu", "memo", "naver", "reel"].forEach(k => $("a_" + k).addEventListener("input", out));
$("a_copy").onclick = async () => { try { await navigator.clipboard.writeText($("a_out").textContent); toast("복사했어요"); } catch { toast("복사하지 못했어요. 직접 선택해서 복사해 주세요"); } };
let tt; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2000); }

/* ----- 데이터 불러오기 ----- */
const norm = d => (Array.isArray(d) ? d : []).filter(p => p && p.name && isFinite(p.lat) && isFinite(p.lng))
  .map((p, i) => ({ ...p, id: p.id || "p" + i, lat: +p.lat, lng: +p.lng, type: TYPES.includes(p.type) ? p.type : "기타" }))
  .sort((a, b) => (a.area || "").localeCompare(b.area || "", "ko") || a.name.localeCompare(b.name, "ko"));
const load = m => cache[m.id] ? Promise.resolve(cache[m.id]) :
  fetch(m.file, { cache: "no-cache" }).then(r => r.ok ? r.json() : []).catch(() => []).then(d => (cache[m.id] = norm(d)));
function show(m, first) {
  cur = m; filter = "전체"; query = ""; $("q").value = ""; selId = null;
  document.title = `마시가네 ${m.name} 지도`;
  return load(m).then(d => {
    if (cur !== m) return;
    clearMarkers(); places = d; render(); initialView();
    track(first ? "page_view" : "map_view");
  });
}
window.addEventListener("hashchange", () => { const m = MAPS.find(x => "#" + x.id === location.hash) || MAPS[0]; if (m !== cur) show(m, false); });
Promise.all(MAPS.map(load)).then(renderTabs);
show(cur, true);
</script>
</body>
</html>

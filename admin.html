<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>마시가네 맛집 지도 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1512;--sub:#3E4944;--mute:#6B7570;--line:#E3E8E5;--soft:#F2F4F3;--green:#0B7A50;--green-l:#E3F3EB;--pink:#D6245F}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--soft)}
button,input,select{font-family:inherit;font-size:15px}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:22px;letter-spacing:-.5px}
h1 small{display:block;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:0}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:8px 12px;border-radius:7px;color:var(--sub);font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--sub)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.kpi .l{font-size:13px;color:var(--mute);font-weight:600}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-top:4px}
.kpi.pink .v{color:var(--pink)}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:8px;overflow-x:auto}
.bar{flex:1 0 14px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:14px}
.bar .b{width:100%;background:var(--green);border-radius:4px 4px 0 0;min-height:2px}
.bar .d{font-size:10px;color:var(--mute);white-space:nowrap}
.bar .n{font-size:10px;color:var(--sub);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none}
th.on{color:var(--ink)}
td.name{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.tbl{overflow-x:auto}
.list{display:flex;flex-direction:column;gap:6px;font-size:14px}
.list div{display:flex;justify-content:space-between;gap:8px}
.list span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--mute);font-size:13px}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:16px;padding:24px;border:1px solid var(--line)}
.login h1{margin-bottom:6px}
.login label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.login input{width:100%;border:1px solid #C8D0CB;border-radius:10px;padding:11px 12px;font-size:16px}
.primary{width:100%;margin-top:18px;height:48px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.err{color:#B3261E;font-size:14px;margin-top:10px;min-height:20px}
.empty{padding:20px;text-align:center;color:var(--mute)}
.reps{display:flex;flex-direction:column}
.repi{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.repi:last-child{border-bottom:0}
.repi .h{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.repi .h b{font-size:16px}
.repi .tg{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--sub)}
.repi .tg.new{background:#FDE7EF;color:#B01E50}
.repi .d{font-size:12px;color:var(--mute);margin-left:auto}
.repi p{margin:0;font-size:14px;line-height:1.5;color:var(--sub);word-break:break-all;white-space:pre-wrap}
.repi .bt{display:flex;gap:6px;margin-top:2px}
.repi .bt button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--sub)}
.repi .bt button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.repi .bt button.add{background:#D6245F;border-color:#D6245F;color:#fff}
.repi .tg.added{background:#E3F3EB;color:#08643F}
.modal{position:fixed;inset:0;z-index:50;background:rgba(14,21,18,.5);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.mbox{background:#fff;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;display:flex;flex-direction:column;gap:10px}
@media (min-width:640px){.modal{align-items:center}.mbox{border-radius:20px}}
.mbox h2{margin:0;font-size:20px}
.mbox label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--sub)}
.mbox input,.mbox select,.mbox textarea{width:100%;min-width:0;box-sizing:border-box;border:1px solid #C8D0CB;border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--ink)}
.mbox .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
#pmap{height:280px;border-radius:12px;overflow:hidden;background:var(--soft)}
.mbox .hint{font-size:13px;color:var(--mute);margin:0}
.mbox .row2{display:flex;gap:8px}
.mbox .row2 button{flex:1;height:48px;border:0;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.mbox .save{background:#D6245F;color:#fff}.mbox .save:disabled{opacity:.5}
.mbox .cx{background:var(--soft);color:var(--ink)}
.pk{width:20px;height:20px;border-radius:50%;background:#D6245F;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.added-list .repi .h b{font-size:15px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ph h2{margin:0}
.pq{border:1px solid #C8D0CB;border-radius:10px;padding:8px 12px;min-width:200px}
td.hl{font-weight:700;color:var(--green)}
tr.zero td{color:var(--mute)}
td .ar{margin-left:6px;font-size:12px;color:var(--mute);font-weight:500}
.tbl{max-height:640px;overflow:auto}
thead th{position:sticky;top:0;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=t2hlw513tp"></script>
<script>
/* ===== 설정 (index.html과 같은 값) ===== */
const SUPA_URL = "https://qcrnllwyquqsvebxxwyl.supabase.co";
const SUPA_KEY = "sb_publishable_gfYEhAJYkvEvbgfG1FNV1g_4M2QXUAB";
const MAPS = { yajang: "야장", bangeo: "방어" };
const FILES = { yajang: "places.json", bangeo: "bangeo.json" };
/* ====================================== */

const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => (n || 0).toLocaleString("ko-KR");
if (!SUPA_URL || !SUPA_KEY) { $app.innerHTML = `<div class="login"><h1>설정이 필요해요</h1><p class="muted">admin.html의 SUPA_URL, SUPA_KEY를 채워 주세요.</p></div>`; throw 0; }
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let range = 7, mapF = "all", sortKey = "opens", data = null, pq = "", ALL = null, REP = [], repAll = false, ADDED = [];
// 지도 데이터의 모든 가게 목록 (조회 0인 가게도 표에 보이도록)
const allPlaces = () => ALL ? Promise.resolve(ALL) : Promise.all(Object.entries(FILES).map(([m, f]) =>
  fetch(f, { cache: "no-cache" }).then(r => r.ok ? r.json() : []).catch(() => []).then(d => (Array.isArray(d) ? d : []).map(p => ({ map: m, place_id: p.id, name: p.name, area: p.area || "" })))))
  .then(a => (ALL = a.flat().concat(ADDED.map(p => ({ map: p.map, place_id: "s" + p.id, name: p.name, area: p.area || "" })))));

function loginView(msg) {
  $app.innerHTML = `<form class="login" id="lf">
    <h1>마시가네 관리자</h1><p class="muted">맛집 지도 방문·클릭 통계</p>
    <label for="em">이메일</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">로그인</button>
    <div class="err" id="er">${esc(msg || "")}</div></form>`;
  document.getElementById("lf").onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) document.getElementById("er").textContent = "이메일이나 비밀번호가 맞지 않아요.";
    else load();
  };
}

async function load() {
  const since = range ? new Date(Date.now() - range * 86400000) : new Date("2020-01-01");
  if (range === 1) since.setHours(0, 0, 0, 0);
  $app.innerHTML = `<div class="wrap"><p class="muted">불러오는 중…</p></div>`;
  const { data: d, error } = await sb.rpc("admin_stats", { since: since.toISOString(), map_filter: mapF === "all" ? null : mapF });
  if (error) { if (/JWT|auth|permission/i.test(error.message)) return loginView("다시 로그인해 주세요."); $app.innerHTML = `<div class="wrap"><p class="err">통계를 불러오지 못했어요: ${esc(error.message)}</p></div>`; return; }
  const rp = await sb.from("reports").select("*").order("created_at", { ascending: false }).limit(300);
  REP = rp.error ? [] : rp.data;
  const ap = await sb.from("places").select("*").order("created_at", { ascending: false });
  ADDED = ap.error ? [] : ap.data; ALL = null;
  await allPlaces(); data = d; view();
}

function view() {
  const t = data.totals || {};
  const daily = data.daily || [];
  const max = Math.max(1, ...daily.map(x => x.views));
  const st = new Map((data.places || []).map(p => [p.map + "|" + p.place_id, p]));
  const base = (ALL || []).filter(p => mapF === "all" || p.map === mapF);
  const seen = new Set(base.map(p => p.map + "|" + p.place_id));
  (data.places || []).forEach(p => { if (!seen.has(p.map + "|" + p.place_id)) base.push({ map: p.map, place_id: p.place_id, name: p.name, area: "" }); });
  const rows = base.map(p => { const s = st.get(p.map + "|" + p.place_id) || {}; const r = { ...p, opens: s.opens || 0, info: s.info || 0, mapapp: s.mapapp || 0, reel: s.reel || 0 }; r.total = r.info + r.mapapp + r.reel; return r; });
  const places = rows.sort((a, b) => (b[sortKey] || 0) - (a[sortKey] || 0) || a.name.localeCompare(b.name, "ko"));
  const segR = [[1, "오늘"], [7, "7일"], [30, "30일"], [0, "전체"]].map(([v, l]) => `<button data-r="${v}" class="${v === range ? "on" : ""}">${l}</button>`).join("");
  const segM = [["all", "전체 지도"], ...Object.entries(MAPS)].map(([v, l]) => `<button data-m="${v}" class="${v === mapF ? "on" : ""}">${l}</button>`).join("");
  const th = (k, l) => `<th data-s="${k}" class="${k === sortKey ? "on" : ""}">${l}${k === sortKey ? " ▼" : ""}</th>`;
  $app.innerHTML = `<div class="wrap">
    <header><h1>마시가네 맛집 지도 관리자<small>방문·클릭 통계</small></h1>
      <div class="ctrl"><div class="seg">${segR}</div><div class="seg">${segM}</div><button class="ghost" id="out">로그아웃</button></div></header>
    <section class="kpis">
      <div class="kpi"><div class="l">페이지 방문</div><div class="v">${fmt(t.page_view)}</div></div>
      <div class="kpi"><div class="l">방문자 수</div><div class="v">${fmt(data.visitors)}</div></div>
      <div class="kpi"><div class="l">가게 조회수</div><div class="v">${fmt(t.place_open)}</div></div>
      <div class="kpi"><div class="l">가게 정보·리뷰 클릭</div><div class="v">${fmt(t.info_click)}</div></div>
      <div class="kpi"><div class="l">지도 앱 클릭</div><div class="v">${fmt(t.mapapp_click)}</div></div>
      <div class="kpi pink"><div class="l">인스타 팔로우 클릭</div><div class="v">${fmt(t.insta_click)}</div></div>
    </section>
    <div class="grid2">
      <section class="card"><h2>날짜별 방문</h2>
        ${daily.length ? `<div class="chart" role="img" aria-label="날짜별 페이지 방문 수">${daily.map(x => `<div class="bar" title="${x.day}: 방문 ${x.views}, 방문자 ${x.visitors}, 인스타 ${x.insta}"><span class="n">${x.views}</span><span class="b" style="height:${Math.round(x.views / max * 140)}px"></span><span class="d">${x.day.slice(5)}</span></div>`).join("")}</div>` : `<div class="empty">아직 기록이 없어요</div>`}
      </section>
      <section class="card"><h2>지도별 · 유입 경로</h2>
        <div class="list">${(data.maps || []).map(m => `<div><span>${esc(MAPS[m.map] || m.map)} 지도</span><b>${fmt(m.views)}</b></div>`).join("") || `<span class="muted">기록 없음</span>`}</div>
        <h2 style="margin-top:18px">어디서 들어왔나</h2>
        <div class="list">${(data.refs || []).map(r => `<div><span>${esc(r.ref)}</span><b>${fmt(r.c)}</b></div>`).join("") || `<span class="muted">기록 없음</span>`}</div>
      </section>
    </div>
    <section class="card" id="repCard"></section>
    <section class="card"><div class="ph"><h2>가게별 조회수 <span class="muted">${fmt(places.length)}곳 · 제목을 누르면 정렬</span></h2>
      <input id="pq" class="pq" type="search" placeholder="가게, 동네 검색" value="${esc(pq)}" aria-label="가게 검색"></div>
      ${places.length ? `<div class="tbl"><table><thead><tr><th>가게</th><th>지도</th>${th("opens", "조회수")}${th("info", "정보·리뷰")}${th("mapapp", "지도 앱")}${th("reel", "릴스")}${th("total", "클릭 합계")}</tr></thead>
      <tbody id="ptb"></tbody></table></div>`
      : `<div class="empty">아직 가게를 누른 기록이 없어요</div>`}
    </section>
  </div>`;
  $app.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { range = +b.dataset.r; load(); });
  $app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { mapF = b.dataset.m; load(); });
  const fill = () => { const q = pq.trim().toLowerCase(); const tb = document.getElementById("ptb"); if (!tb) return;
    const list = places.filter(p => !q || (p.name + " " + p.area).toLowerCase().includes(q));
    tb.innerHTML = list.map(p => `<tr class="${p.opens ? "" : "zero"}"><td class="name">${esc(p.name)}${p.area ? `<span class="ar">${esc(p.area)}</span>` : ""}</td><td>${esc(MAPS[p.map] || p.map)}</td><td class="hl">${fmt(p.opens)}</td><td>${fmt(p.info)}</td><td>${fmt(p.mapapp)}</td><td>${fmt(p.reel)}</td><td>${fmt(p.total)}</td></tr>`).join("") || `<tr><td colspan="7" class="empty">검색 결과가 없어요</td></tr>`; };
  fill();
  repView();
  const pqi = document.getElementById("pq"); if (pqi) pqi.oninput = e => { pq = e.target.value; fill(); };
  $app.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { sortKey = b.dataset.s; view(); });
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); loginView(); };
}

const ST = { new: "새 제보", ok: "확인함", hold: "보류", no: "거절", added: "지도에 올림" };
const TYPES = ["노가리·호프", "포차", "고기", "해산물", "전·막걸리", "치킨", "횟집", "이자카야·바", "수산시장", "방어", "기타"];
const GU = ["강남구","강동구","강북구","강서구","관악구","광진구","구로구","금천구","노원구","도봉구","동대문구","동작구","마포구","서대문구","서초구","성동구","성북구","송파구","양천구","영등포구","용산구","은평구","종로구","중구","중랑구","서울 밖"];
function repView() {
  const box = document.getElementById("repCard"); if (!box) return;
  const nNew = REP.filter(r => r.status === "new").length;
  const list = repAll ? REP : REP.filter(r => r.status === "new" || r.status === "hold");
  const day = t => new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const link = u => /^https?:\/\//i.test(u || "") ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : esc(u || "");
  box.innerHTML = `<div class="ph"><h2>맛집 제보 <span class="muted">새 제보 ${nNew}건</span></h2>
    <div class="seg"><button data-ra="0" class="${repAll ? "" : "on"}">처리할 것</button><button data-ra="1" class="${repAll ? "on" : ""}">전체 ${REP.length}</button></div></div>
    ${list.length ? `<div class="reps">${list.map(r => `<div class="repi">
      <div class="h"><b>${esc(r.name)}</b><span class="tg ${r.status === "new" ? "new" : r.status === "added" ? "added" : ""}">${ST[r.status] || r.status}</span><span class="tg">${esc(MAPS[r.map] || (r.map === "etc" ? "기타" : r.map || "기타"))}</span><span class="d">${day(r.created_at)}</span></div>
      ${r.link ? `<p>${link(r.link)}</p>` : ""}${r.note ? `<p>${esc(r.note)}</p>` : ""}${r.contact ? `<p>제보자 ${esc(r.contact)}</p>` : ""}
      <div class="bt">${r.status === "added" ? "" : `<button class="add" data-add="${r.id}">지도에 올리기</button>`}${["ok", "hold", "no"].map(s => `<button data-id="${r.id}" data-st="${s}" class="${r.status === s ? "on" : ""}">${ST[s]}</button>`).join("")}</div>
    </div>`).join("")}</div>` : `<div class="empty">${repAll ? "아직 제보가 없어요" : "처리할 제보가 없어요"}</div>`}
    ${ADDED.length ? `<h2 style="margin-top:20px">지도에 올린 가게 <span class="muted">${ADDED.length}곳</span></h2><div class="reps added-list">${ADDED.map(p => `<div class="repi">
      <div class="h"><b>${esc(p.name)}</b><span class="tg">${esc(MAPS[p.map] || p.map)}</span><span class="tg">${esc(p.area || "")}</span><span class="d">${day(p.created_at)}</span></div>
      <div class="bt"><button data-del="${p.id}">지도에서 내리기</button></div></div>`).join("")}</div>` : ""}`;
  box.querySelectorAll("[data-add]").forEach(b => b.onclick = () => openPlace(REP.find(x => x.id === +b.dataset.add)));
  box.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    const p = ADDED.find(x => x.id === +b.dataset.del);
    if (!p || !confirm(`"${p.name}"을(를) 지도에서 내릴까요?`)) return;
    const { error } = await sb.from("places").delete().eq("id", p.id);
    if (error) { alert("내리지 못했어요: " + error.message); return; }
    if (p.report_id) { await sb.from("reports").update({ status: "ok" }).eq("id", p.report_id); const r = REP.find(x => x.id === p.report_id); if (r) r.status = "ok"; }
    ADDED = ADDED.filter(x => x.id !== p.id); repView();
  });
  box.querySelectorAll("[data-ra]").forEach(b => b.onclick = () => { repAll = b.dataset.ra === "1"; repView(); });
  box.querySelectorAll("[data-st]").forEach(b => b.onclick = async () => {
    const id = +b.dataset.id, st = b.dataset.st;
    const { error } = await sb.from("reports").update({ status: st }).eq("id", id);
    if (error) { alert("바꾸지 못했어요: " + error.message); return; }
    const r = REP.find(x => x.id === id); if (r) r.status = st; repView();
  });
}

/* ----- 제보 → 지도에 올리기 ----- */
let pm = null, pk = null, pPos = null, pRep = null;
function openPlace(r) {
  if (!r) return; pRep = r; pPos = null;
  const isUrl = /^https?:\/\//i.test(r.link || "") || /naver\.me/i.test(r.link || "");
  const opt = (arr, v) => arr.map(x => `<option ${x === v ? "selected" : ""}>${esc(x)}</option>`).join("");
  const mapOpt = Object.entries(MAPS).map(([k, l]) => `<option value="${k}" ${k === r.map ? "selected" : ""}>${esc(l)}</option>`).join("");
  let m = document.getElementById("pmodal");
  if (!m) { m = document.createElement("div"); m.id = "pmodal"; m.className = "modal"; document.body.appendChild(m); m.onclick = e => { if (e.target === m) closePlace(); }; }
  m.innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="pmT">
    <h2 id="pmT">지도에 올리기</h2>
    <label>가게 이름<input id="pf_name" value="${esc(r.name)}"></label>
    <div class="two"><label>지도<select id="pf_map">${mapOpt}</select></label><label>종류<select id="pf_type">${opt(TYPES, r.map === "bangeo" ? "횟집" : "기타")}</select></label></div>
    <div class="two"><label>구<select id="pf_area"><option value="">선택</option>${opt(GU, GU.find(g => g !== "중구" && ((r.link || "") + " " + (r.note || "")).includes(g)) || "")}</select></label><label>주소<input id="pf_addr" value="${isUrl ? "" : esc(r.link || "")}" placeholder="서울 ○○구 …"></label></div>
    <label>네이버 지도 링크<input id="pf_naver" value="${isUrl ? esc(r.link) : ""}" placeholder="https://naver.me/…"></label>
    <label>한 줄 메모<input id="pf_memo" value="${esc(r.note || "")}"></label>
    <p class="hint">아래 지도에서 가게 위치를 눌러 주세요. 위치가 헷갈리면 <a href="https://map.naver.com/p/search/${encodeURIComponent(r.name)}" target="_blank" rel="noopener">네이버 지도에서 검색</a>해서 확인하세요.</p>
    <div id="pmap"></div>
    <div class="row2"><button class="cx" id="pf_cancel">취소</button><button class="save" id="pf_save" disabled>위치를 먼저 찍어 주세요</button></div>
  </div>`;
  m.classList.add("open");
  document.getElementById("pf_cancel").onclick = closePlace;
  document.getElementById("pf_save").onclick = savePlace;
  if (!(window.naver && naver.maps && naver.maps.Map)) { document.getElementById("pmap").innerHTML = `<p class="hint" style="padding:16px">지도를 불러오지 못했어요. 새로고침해 주세요.</p>`; return; }
  pm = new naver.maps.Map("pmap", { center: new naver.maps.LatLng(37.548, 126.99), zoom: 12, zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT } });
  pk = null;
  naver.maps.Event.addListener(pm, "click", e => {
    pPos = { lat: +e.coord.lat().toFixed(6), lng: +e.coord.lng().toFixed(6) };
    if (!pk) pk = new naver.maps.Marker({ position: e.coord, map: pm, icon: { content: '<div class="pk"></div>', anchor: new naver.maps.Point(10, 10) } });
    else pk.setPosition(e.coord);
    const s = document.getElementById("pf_save"); s.disabled = false; s.textContent = "지도에 올리기";
  });
}
function closePlace() { const m = document.getElementById("pmodal"); if (m) m.classList.remove("open"); if (pm) { if (pm.destroy) pm.destroy(); pm = null; } }
async function savePlace() {
  if (!pPos || !pRep) return;
  const g = id => document.getElementById(id).value.trim();
  if (!g("pf_name")) { alert("가게 이름을 넣어 주세요"); return; }
  const row = { map: g("pf_map"), name: g("pf_name"), type: g("pf_type"), area: g("pf_area"), address: g("pf_addr") || null, naver: g("pf_naver") || null, memo: g("pf_memo") || null, lat: pPos.lat, lng: pPos.lng, report_id: pRep.id };
  const s = document.getElementById("pf_save"); s.disabled = true; s.textContent = "올리는 중…";
  const { data: ins, error } = await sb.from("places").insert(row).select().single();
  if (error) { alert("올리지 못했어요: " + error.message); s.disabled = false; s.textContent = "지도에 올리기"; return; }
  await sb.from("reports").update({ status: "added" }).eq("id", pRep.id);
  pRep.status = "added"; ADDED.unshift(ins); ALL = null;
  closePlace(); repView();
  alert(`"${ins.name}"을(를) ${MAPS[ins.map] || ins.map} 지도에 올렸어요`);
}

sb.auth.getSession().then(({ data: { session } }) => session ? load() : loginView());
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마시가네 야장 지도</title>
<meta name="description" content="오늘은 어디서 마시가? 마시가네(@masigane_masiga)가 다녀온 야장 지도">
<meta property="og:title" content="마시가네 야장 지도">
<meta property="og:description" content="오늘은 어디서 마시가? 🍻 @masigane_masiga">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1120;--panel:#171b2d;--panel2:#1f2439;--line:#2b3150;--text:#f4efe4;--muted:#8e94ae;--lantern:#ffb547;--red:#ff5d4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:30px;line-height:1.05;margin:0}
h1 .hl{color:var(--lantern);text-shadow:0 0 18px rgba(255,181,71,.45)}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.sub a{color:var(--muted)}
.count{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--lantern);font-weight:700}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 14px;font-size:16px;font-family:inherit;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--lantern);color:#1b1404;border-color:var(--lantern);font-weight:700}
.mapbox{position:relative;height:58vh;min-height:340px;max-height:600px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#1a1f33}
#map{width:100%;height:100%}
.mapmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:20px}
/* markers */
.mk{position:relative;width:34px;height:42px;cursor:pointer}
.mk .b{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--lantern);border:2px solid #0e1120;box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 12px rgba(255,181,71,.55)}
.mk .e{position:absolute;left:0;top:0;width:34px;height:34px;display:grid;place-items:center;font-size:16px}
.mk .l{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 11px "Noto Sans KR",sans-serif;color:#1b1404;background:#fff;border-radius:6px;padding:2px 6px;box-shadow:0 1px 4px rgba(0,0,0,.25);display:none}
.show-labels .mk .l{display:block}
.mk.sel .b{background:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.35),0 0 16px rgba(255,93,79,.9)}
.mk.sel .l{display:block;background:var(--red);color:#fff}
.mk.temp .b{background:#7cf0c4}
.selcard{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(23,27,45,.97);border:1px solid var(--line);border-radius:16px;padding:14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:100}
.selcard.show{display:block}
.selcard .x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.pname{font-weight:700;font-size:17px;padding-right:26px}
.pmeta{color:var(--muted);font-size:12.5px;margin-top:3px}
.pmemo{font-size:13.5px;margin-top:8px;line-height:1.5;white-space:pre-wrap}
.btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-family:inherit}
.btn.naver{background:#03c75a;border-color:#03c75a;color:#fff}
.btn.reel{background:linear-gradient(45deg,#f9a13a,#e1306c,#833ab4);border:0;color:#fff}
.btn.primary{background:var(--lantern);border-color:var(--lantern);color:#1b1404}
h2{font-size:15px;margin:22px 0 10px;color:var(--muted);font-weight:500}
.list{display:grid;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item.sel{border-color:var(--red)}
.item .em{flex:none;width:40px;height:40px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;font-size:20px}
.item .t{min-width:0}
.item .n{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:26px;line-height:1.6}
/* admin helper (?admin) */
.admin{display:none;margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
body.is-admin .admin{display:block}
.admin h3{margin:0 0 8px;font-size:15px}
.admin p{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.5}
.admin label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.admin input,.admin select,.admin textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:16px;font-family:inherit}
.admin textarea{min-height:60px}
.admin pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all;color:#7cf0c4;min-height:40px}
.row{display:flex;gap:8px}.row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>마시가네 <span class="hl">야장</span> 지도</h1>
      <div class="sub">오늘은 어디서 마시가? 🍻 <a href="https://www.instagram.com/masigane_masiga/" target="_blank" rel="noopener">@masigane_masiga</a></div>
    </div>
    <div class="count" id="count">0곳</div>
  </header>

  <input class="search" id="q" type="search" placeholder="가게 이름, 동네, 메뉴 검색">
  <div class="chips" id="chips"></div>

  <div class="mapbox" id="mapbox">
    <div id="map"></div>
    <div class="mapmsg" id="mapmsg">지도를 불러오는 중…</div>
    <div class="selcard" id="selcard"></div>
  </div>

  <h2 id="listTitle">야장 목록</h2>
  <div class="list" id="list"></div>

  <section class="admin" id="admin">
    <h3>🛠 야장 추가 도우미</h3>
    <p>지도를 탭하면 위치가 찍혀요. 내용을 채우고 <b>JSON 복사</b>를 누른 뒤, <code>places.json</code> 배열 끝에 붙여 넣고 커밋하면 반영돼요.</p>
    <div class="row">
      <div><label>가게 이름</label><input id="a_name"></div>
      <div><label>동네(필터명)</label><input id="a_area" placeholder="예) 중구"></div>
    </div>
    <div class="row">
      <div><label>종류</label><select id="a_type"></select></div>
      <div><label>대표 메뉴</label><input id="a_menu"></div>
    </div>
    <label>메모</label><textarea id="a_memo"></textarea>
    <label>네이버지도 링크</label><input id="a_naver" placeholder="https://map.naver.com/p/entry/place/...">
    <label>릴스 링크</label><input id="a_reel">
    <label>위치</label><div class="pmeta" id="a_loc">지도를 탭하세요</div>
    <label>결과</label><pre id="a_out"></pre>
    <button class="btn primary" id="a_copy">JSON 복사</button>
  </section>

  <footer>지도 데이터 © NAVER Corp. · 길찾기는 각 가게의 ‘네이버지도’ 버튼을 눌러 주세요.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 설정 ===== */
// 네이버 클라우드 플랫폼 > Maps > Application에서 발급받은 Client ID (ncpKeyId)
const NCP_KEY_ID = "t2hlw513tp";
const DATA_URL = "places.json";
/* ================ */

const TYPES = { "노가리·호프": "🍺", "포차": "🏮", "고기": "🥩", "해산물": "🦑", "전·막걸리": "🥞", "치킨": "🍗", "기타": "🍻" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => { try { const x = new URL(String(u || "").trim()); return /^https?:$/.test(x.protocol) ? x.href : ""; } catch { return ""; } };
const naverUrl = p => safeUrl(p.naver) || "https://map.naver.com/p/search/" + encodeURIComponent(`${p.name} ${p.area || ""}`.trim());
const isAdmin = new URLSearchParams(location.search).has("admin");
if (isAdmin) document.body.classList.add("is-admin");

let places = [], filter = "전체", query = "", selId = null;
let map = null, markers = new Map(), tempMarker = null;

function visible() {
  const q = query.trim().toLowerCase();
  return places.filter(p => (filter === "전체" || p.area === filter) &&
    (!q || [p.name, p.area, p.menu, p.memo, p.address].some(v => (v || "").toLowerCase().includes(q))));
}

/* ----- list & chips ----- */
function render() {
  $("count").textContent = places.length + "곳";
  const cnt = {}; places.forEach(p => { if (p.area) cnt[p.area] = (cnt[p.area] || 0) + 1; });
  const areas = Object.keys(cnt).sort((a, b) => (a === "서울 밖") - (b === "서울 밖") || cnt[b] - cnt[a]);
  const chips = $("chips"); chips.innerHTML = "";
  ["전체", ...areas].forEach(a => {
    const b = document.createElement("button");
    b.className = "chip" + (a === filter ? " on" : "");
    b.textContent = a === "전체" ? `전체 ${places.length}` : `${a} ${cnt[a]}`;
    b.onclick = () => { filter = a; selId = null; render(); fit(); };
    chips.appendChild(b);
  });
  const shown = visible();
  $("listTitle").textContent = (filter === "전체" ? "야장 목록" : `${filter} 야장`) + ` (${shown.length})`;
  const list = $("list"); list.innerHTML = "";
  if (!shown.length) list.innerHTML = `<div class="empty">찾는 야장이 없어요 🏮</div>`;
  shown.forEach(p => {
    const d = document.createElement("div"); d.className = "item" + (p.id === selId ? " sel" : "");
    d.innerHTML = `<div class="em">${TYPES[p.type] || "🍻"}</div><div class="t"><div class="n">${esc(p.name)}</div><div class="m">${esc([p.area, p.menu || p.address].filter(Boolean).join(" · "))}</div></div>`;
    d.onclick = () => { select(p.id, true); $("mapbox").scrollIntoView({ behavior: "smooth", block: "start" }); };
    list.appendChild(d);
  });
  syncMarkers(); renderSel();
}

function renderSel() {
  const c = $("selcard"); const p = places.find(x => x.id === selId);
  if (!p) { c.classList.remove("show"); return; }
  const reel = safeUrl(p.reel);
  c.innerHTML = `<button class="x" aria-label="닫기">×</button>
    <div class="pname">${TYPES[p.type] || "🍻"} ${esc(p.name)}</div>
    <div class="pmeta">${esc([p.area, p.type, p.menu].filter(Boolean).join(" · "))}</div>
    ${p.address ? `<div class="pmeta">📍 ${esc(p.address)}</div>` : ""}
    ${p.memo ? `<div class="pmemo">${esc(p.memo)}</div>` : ""}
    <div class="btns">
      <a class="btn naver" href="${esc(naverUrl(p))}" target="_blank" rel="noopener">N 네이버지도</a>
      ${reel ? `<a class="btn reel" href="${esc(reel)}" target="_blank" rel="noopener">▶ 릴스 보기</a>` : ""}
    </div>`;
  c.classList.add("show");
  c.querySelector(".x").onclick = () => { selId = null; render(); };
}

function select(id, pan) {
  selId = id; render();
  const p = places.find(x => x.id === id);
  if (p && pan && map) { map.morph(new naver.maps.LatLng(p.lat, p.lng), Math.max(map.getZoom(), 16)); }
}

/* ----- map ----- */
function markerHtml(p, sel) {
  return `<div class="mk${sel ? " sel" : ""}"><div class="b"></div><div class="e">${TYPES[p.type] || "🍻"}</div><div class="l">${esc(p.name)}</div></div>`;
}
function syncMarkers() {
  if (!map) return;
  const vis = new Set(visible().map(p => p.id));
  places.forEach(p => {
    let m = markers.get(p.id);
    if (!m) {
      m = new naver.maps.Marker({ position: new naver.maps.LatLng(p.lat, p.lng), map: null,
        icon: { content: markerHtml(p, false), anchor: new naver.maps.Point(17, 42) } });
      naver.maps.Event.addListener(m, "click", () => select(p.id, false));
      m._sel = false; markers.set(p.id, m);
    }
    const sel = p.id === selId;
    if (m._sel !== sel) { m.setIcon({ content: markerHtml(p, sel), anchor: new naver.maps.Point(17, 42) }); m.setZIndex(sel ? 1000 : 0); m._sel = sel; }
    const want = vis.has(p.id) ? map : null;
    if (m.getMap() !== want) m.setMap(want);
  });
}
function fit() {
  if (!map) return;
  const vis = visible();
  if (!vis.length) return;
  if (vis.length === 1) { map.morph(new naver.maps.LatLng(vis[0].lat, vis[0].lng), 16); return; }
  const lats = vis.map(p => p.lat), lngs = vis.map(p => p.lng);
  const b = new naver.maps.LatLngBounds(new naver.maps.LatLng(Math.min(...lats), Math.min(...lngs)), new naver.maps.LatLng(Math.max(...lats), Math.max(...lngs)));
  map.fitBounds(b, { top: 40, right: 30, bottom: 40, left: 30 });
}
function initialFit() {
  // 전체 보기일 때는 서울 중심으로 시작 (지방 가게 때문에 너무 넓어지지 않게)
  if (filter === "전체") { map.setCenter(new naver.maps.LatLng(37.552, 126.99)); map.setZoom(12); } else fit();
}

window.initMap = function () {
  (function wait(n) { if (window.naver && naver.maps && naver.maps.Map) startMap(); else if (n < 200) setTimeout(() => wait(n + 1), 50); })(0);
};
function startMap() {
  $("mapmsg").remove();
  map = new naver.maps.Map("map", {
    center: new naver.maps.LatLng(37.552, 126.99), zoom: 12,
    zoomControl: true, zoomControlOptions: { position: naver.maps.Position.TOP_RIGHT },
    scaleControl: false, mapDataControl: false, logoControlOptions: { position: naver.maps.Position.TOP_LEFT }
  });
  const toggleLabels = () => $("map").classList.toggle("show-labels", map.getZoom() >= 16);
  naver.maps.Event.addListener(map, "zoom_changed", toggleLabels); toggleLabels();
  naver.maps.Event.addListener(map, "click", e => {
    if (isAdmin) { setTemp(e.coord.lat(), e.coord.lng()); return; }
    if (selId) { selId = null; render(); }
  });
  render(); initialFit();
};
window.navermap_authFailure = function () {
  const box = $("mapbox"); box.innerHTML = `<div class="mapmsg">지도 인증에 실패했어요.<br>NCP 콘솔에서 Client ID와 서비스 URL 등록을 확인해 주세요.</div>`;
};

function loadMap() {
  if (!NCP_KEY_ID || NCP_KEY_ID.startsWith("YOUR_")) { $("mapmsg").innerHTML = "index.html의 <b>NCP_KEY_ID</b>를 입력하면<br>네이버 지도가 표시돼요."; return; }
  const s = document.createElement("script");
  s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${encodeURIComponent(NCP_KEY_ID)}&callback=initMap`;
  s.onerror = () => { $("mapmsg").textContent = "지도를 불러오지 못했어요. 잠시 후 새로고침해 주세요."; };
  document.head.appendChild(s);
}

/* ----- admin helper ----- */
let tmp = null;
function setTemp(lat, lng) {
  tmp = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
  $("a_loc").textContent = `${tmp.lat}, ${tmp.lng}`;
  const html = `<div class="mk temp"><div class="b"></div><div class="e">📍</div></div>`;
  if (!tempMarker) tempMarker = new naver.maps.Marker({ position: new naver.maps.LatLng(tmp.lat, tmp.lng), map, icon: { content: html, anchor: new naver.maps.Point(17, 42) } });
  else tempMarker.setPosition(new naver.maps.LatLng(tmp.lat, tmp.lng));
  out();
}
function out() {
  const v = k => $("a_" + k).value.trim();
  const name = v("name");
  const o = { id: "m" + Date.now().toString(36), name, area: v("area"), type: $("a_type").value, address: "", memo: v("memo"), menu: v("menu"), naver: v("naver"), reel: v("reel"), lat: tmp ? tmp.lat : null, lng: tmp ? tmp.lng : null };
  $("a_out").textContent = name && tmp ? JSON.stringify(o, null, 0) + "," : "가게 이름과 위치를 넣어 주세요";
}
Object.keys(TYPES).forEach(t => { const o = document.createElement("option"); o.value = t; o.textContent = `${TYPES[t]} ${t}`; $("a_type").appendChild(o); });
["name", "area", "type", "menu", "memo", "naver", "reel"].forEach(k => $("a_" + k).addEventListener("input", out));
$("a_copy").onclick = async () => { try { await navigator.clipboard.writeText($("a_out").textContent); toast("복사했어요"); } catch { toast("복사 실패: 직접 선택해서 복사해 주세요"); } };

let tt; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2000); }

$("q").addEventListener("input", e => { query = e.target.value; selId = null; render(); });

/* ----- boot ----- */
fetch(DATA_URL, { cache: "no-cache" }).then(r => r.json()).then(d => {
  places = (Array.isArray(d) ? d : []).filter(p => p && p.name && isFinite(p.lat) && isFinite(p.lng))
    .map((p, i) => ({ ...p, id: p.id || "p" + i, lat: +p.lat, lng: +p.lng, type: TYPES[p.type] ? p.type : "기타" }))
    .sort((a, b) => (a.area || "").localeCompare(b.area || "", "ko") || a.name.localeCompare(b.name, "ko"));
  render(); if (map) initialFit();
}).catch(() => { $("list").innerHTML = `<div class="empty">목록을 불러오지 못했어요</div>`; });
loadMap();
</script>
</body>
</html>
